<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="LoopCart cart and checkout mockup">
  <defs>
    <style>
      .bg{fill:#f6f8fb}.surface{fill:#fff;stroke:#e5e9f0;stroke-width:2}.ink{fill:#121826}.slate{fill:#4b5565}.muted{fill:#6b7280}.teal{fill:#10a7a7}.coral{fill:#ff6b5f}.amber{fill:#f6b84b}.blue{fill:#4b7bec}.mint{fill:#dff7ef}.title{font:800 34px Inter,Arial,sans-serif}.h2{font:800 24px Inter,Arial,sans-serif}.h3{font:800 18px Inter,Arial,sans-serif}.body{font:500 15px Inter,Arial,sans-serif}.small{font:700 12px Inter,Arial,sans-serif}.micro{font:800 10px Inter,Arial,sans-serif}.buttonText{fill:#fff;font:800 13px Inter,Arial,sans-serif}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#121826" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect class="bg" width="1440" height="1040"/>
  <text x="64" y="54" class="micro teal">Figma screen 03</text>
  <text x="64" y="90" class="title ink">Cart And Checkout</text>
  <text x="64" y="118" class="body slate">Cart, delivery choice, wallet credit, group discount, and final checkout summary.</text>

  <rect x="64" y="154" width="1312" height="806" rx="18" class="surface shadow"/>
  <text x="104" y="216" class="title ink">Checkout</text>
  <text x="104" y="250" class="body slate">Review items and use LoopCart savings before payment.</text>

  <g transform="translate(104 300)">
    <text x="0" y="0" class="h2 ink">Cart items</text>
    <rect x="0" y="34" width="680" height="120" rx="12" class="surface"/>
    <rect x="20" y="54" width="100" height="80" rx="10" fill="#e9f6f6"/>
    <rect x="44" y="104" width="52" height="10" rx="4" class="ink"/>
    <rect x="140" y="62" width="210" height="18" rx="8" class="ink"/>
    <rect x="140" y="96" width="280" height="14" rx="7" fill="#e5e9f0"/>
    <text x="140" y="132" class="small teal">Product Passport verified</text>
    <text x="590" y="92" class="h3 ink">$129</text>

    <rect x="0" y="172" width="680" height="120" rx="12" class="surface"/>
    <rect x="20" y="192" width="100" height="80" rx="10" fill="#eef3ff"/>
    <circle cx="58" cy="232" r="20" class="teal"/>
    <circle cx="86" cy="232" r="20" class="blue"/>
    <rect x="140" y="200" width="220" height="18" rx="8" class="ink"/>
    <rect x="140" y="234" width="260" height="14" rx="7" fill="#e5e9f0"/>
    <text x="140" y="270" class="small teal">Group-buy eligible</text>
    <text x="596" y="230" class="h3 ink">$89</text>

    <text x="0" y="346" class="h2 ink">Delivery options</text>
    <rect x="0" y="380" width="208" height="104" rx="12" fill="#fff" stroke="#e5e9f0" stroke-width="2"/>
    <text x="20" y="416" class="h3 ink">Fast</text>
    <text x="20" y="450" class="body slate">Tomorrow - $8.99</text>
    <rect x="236" y="380" width="208" height="104" rx="12" fill="#eefafa" stroke="#10a7a7" stroke-width="3"/>
    <text x="256" y="416" class="h3 ink">Standard</text>
    <text x="256" y="450" class="body slate">3 days - $4.99</text>
    <rect x="472" y="380" width="208" height="104" rx="12" fill="#fff7e7" stroke="#f6b84b" stroke-width="2"/>
    <text x="492" y="416" class="h3 ink">Delay-To-Save</text>
    <text x="492" y="450" class="body slate">5 days - $1.99</text>

    <text x="0" y="546" class="h2 ink">Payment method</text>
    <rect x="0" y="580" width="680" height="78" rx="12" class="surface"/>
    <circle cx="36" cy="619" r="12" fill="#10a7a7"/>
    <text x="64" y="624" class="h3 ink">Card ending 4242</text>
    <text x="470" y="624" class="small slate">Change</text>
  </g>

  <g transform="translate(840 300)">
    <rect width="420" height="548" rx="14" fill="#fff" stroke="#e5e9f0" stroke-width="2"/>
    <text x="28" y="52" class="h2 ink">Order summary</text>
    <text x="28" y="100" class="body slate">Subtotal</text>
    <text x="328" y="100" class="h3 ink">$218.00</text>
    <text x="28" y="142" class="body slate">Group discount</text>
    <text x="328" y="142" class="h3 teal">-$21.80</text>
    <text x="28" y="184" class="body slate">Wallet credit</text>
    <text x="328" y="184" class="h3 coral">-$12.00</text>
    <text x="28" y="226" class="body slate">Delivery</text>
    <text x="338" y="226" class="h3 ink">$4.99</text>
    <line x1="28" y1="264" x2="392" y2="264" stroke="#e5e9f0" stroke-width="2"/>
    <text x="28" y="314" class="h2 ink">Total</text>
    <text x="286" y="314" class="title ink">$189.19</text>
    <rect x="28" y="350" width="364" height="50" rx="8" fill="#121826"/>
    <text x="160" y="381" class="buttonText">Place order</text>

    <rect x="28" y="430" width="364" height="84" rx="12" fill="#eefafa"/>
    <text x="48" y="462" class="h3 ink">Trade-In Wallet</text>
    <text x="48" y="492" class="body slate">Estimated future credit: $82</text>
  </g>

  <rect x="840" y="204" width="420" height="74" rx="12" fill="#fff7e7" stroke="#f1dda9" stroke-width="2"/>
  <text x="868" y="236" class="h3 ink">Social Cart active</text>
  <rect x="868" y="250" width="248" height="10" rx="5" fill="#e5e9f0"/>
  <rect x="868" y="250" width="124" height="10" rx="5" class="teal"/>
  <text x="1134" y="258" class="small slate">10% off</text>
</svg>
