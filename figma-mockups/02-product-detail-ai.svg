<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="LoopCart product detail and AI panel mockup">
  <defs>
    <style>
      .bg{fill:#f6f8fb}.surface{fill:#fff;stroke:#e5e9f0;stroke-width:2}.ink{fill:#121826}.slate{fill:#4b5565}.muted{fill:#6b7280}.teal{fill:#10a7a7}.coral{fill:#ff6b5f}.amber{fill:#f6b84b}.blue{fill:#4b7bec}.mint{fill:#dff7ef}.title{font:800 34px Inter,Arial,sans-serif}.h2{font:800 24px Inter,Arial,sans-serif}.h3{font:800 18px Inter,Arial,sans-serif}.body{font:500 15px Inter,Arial,sans-serif}.small{font:700 12px Inter,Arial,sans-serif}.micro{font:800 10px Inter,Arial,sans-serif}.buttonText{fill:#fff;font:800 13px Inter,Arial,sans-serif}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#121826" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect class="bg" width="1440" height="1040"/>
  <text x="64" y="54" class="micro teal">Figma screen 02</text>
  <text x="64" y="90" class="title ink">Product Detail With AI</text>
  <text x="64" y="118" class="body slate">Product trust, alternatives, delivery choices, and AI explanation before purchase.</text>

  <rect x="64" y="154" width="1312" height="806" rx="18" class="surface shadow"/>
  <rect x="96" y="186" width="1248" height="56" rx="12" fill="#fff" stroke="#e5e9f0" stroke-width="2"/>
  <text x="122" y="221" class="h3 ink">LoopCart</text>
  <rect x="480" y="196" width="430" height="36" rx="8" fill="#f6f8fb" stroke="#e5e9f0" stroke-width="2"/>
  <text x="502" y="219" class="body muted">Search product passport</text>
  <text x="1172" y="221" class="small slate">Home / Workspace / Desk</text>

  <rect x="96" y="278" width="470" height="420" rx="14" fill="#e9f6f6" stroke="#ccefed" stroke-width="2"/>
  <rect x="186" y="552" width="290" height="26" rx="8" class="ink"/>
  <rect x="232" y="402" width="198" height="112" rx="16" fill="#fff" stroke="#10a7a7" stroke-width="10"/>
  <rect x="280" y="338" width="104" height="54" rx="12" class="ink"/>
  <rect x="304" y="510" width="56" height="42" rx="8" class="teal"/>
  <circle cx="476" cy="350" r="42" class="coral"/>
  <path d="M458 351l14 14 28-38" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="96" y="720" width="102" height="84" rx="10" fill="#e9f6f6" stroke="#10a7a7" stroke-width="3"/>
  <rect x="216" y="720" width="102" height="84" rx="10" fill="#eef3ff" stroke="#e5e9f0" stroke-width="2"/>
  <rect x="336" y="720" width="102" height="84" rx="10" fill="#fff7e7" stroke="#e5e9f0" stroke-width="2"/>
  <rect x="456" y="720" width="102" height="84" rx="10" fill="#fff3f1" stroke="#e5e9f0" stroke-width="2"/>

  <g transform="translate(606 286)">
    <rect x="0" y="0" width="404" height="100" rx="12" fill="#fff" stroke="#e5e9f0" stroke-width="2"/>
    <text x="0" y="-18" class="micro teal">Verified product</text>
    <text x="0" y="28" class="title ink">FlexLift Desk Riser</text>
    <text x="0" y="64" class="body slate">Height-adjustable desk riser with product passport, verified repair parts, and resale eligibility.</text>
    <text x="0" y="124" class="title ink">$129</text>
    <text x="104" y="122" class="body slate">4.8 rating - 1,284 reviews</text>
    <rect x="0" y="154" width="144" height="44" rx="8" fill="#121826"/>
    <text x="38" y="182" class="buttonText">Add cart</text>
    <rect x="158" y="154" width="144" height="44" rx="8" fill="#10a7a7"/>
    <text x="202" y="182" class="buttonText">Buy now</text>
    <rect x="316" y="154" width="88" height="44" rx="8" fill="#fff" stroke="#121826" stroke-width="2"/>
    <text x="338" y="182" class="small ink">Save</text>
  </g>

  <g transform="translate(606 540)">
    <text x="0" y="0" class="h2 ink">Product Passport</text>
    <rect x="0" y="28" width="192" height="92" rx="10" fill="#f6f8fb" stroke="#e5e9f0" stroke-width="2"/>
    <text x="20" y="58" class="small muted">TrustScore</text>
    <text x="20" y="96" class="h2 ink">94/100</text>
    <rect x="212" y="28" width="192" height="92" rx="10" fill="#f6f8fb" stroke="#e5e9f0" stroke-width="2"/>
    <text x="232" y="58" class="small muted">Warranty</text>
    <text x="232" y="96" class="h2 ink">24 mo</text>
    <rect x="0" y="140" width="192" height="92" rx="10" fill="#f6f8fb" stroke="#e5e9f0" stroke-width="2"/>
    <text x="20" y="170" class="small muted">Resale estimate</text>
    <text x="20" y="208" class="h2 ink">52%</text>
    <rect x="212" y="140" width="192" height="92" rx="10" fill="#f6f8fb" stroke="#e5e9f0" stroke-width="2"/>
    <text x="232" y="170" class="small muted">Carbon score</text>
    <text x="232" y="208" class="h2 ink">81</text>
  </g>

  <rect x="1060" y="278" width="252" height="420" rx="14" fill="#eefafa" stroke="#ccefed" stroke-width="2"/>
  <text x="1084" y="316" class="micro teal">AI explanation</text>
  <text x="1084" y="352" class="h2 ink">Why this fits</text>
  <text x="1084" y="394" class="body slate">Matches compact workspace goal.</text>
  <text x="1084" y="430" class="body slate">Seller trust above 90.</text>
  <text x="1084" y="466" class="body slate">Strong future resale value.</text>
  <text x="1084" y="502" class="body slate">Pairs with LoopSound Pods.</text>
  <rect x="1084" y="544" width="184" height="44" rx="8" fill="#121826"/>
  <text x="1122" y="572" class="buttonText">Compare items</text>
  <rect x="1084" y="608" width="184" height="44" rx="8" fill="#fff" stroke="#121826" stroke-width="2"/>
  <text x="1126" y="636" class="small ink">Ask a question</text>

  <rect x="1060" y="720" width="252" height="104" rx="14" fill="#fff7e7" stroke="#f1dda9" stroke-width="2"/>
  <text x="1084" y="756" class="h3 ink">Delivery</text>
  <text x="1084" y="790" class="body slate">Delay-To-Save: $1.99, 5 days, lower carbon route.</text>
</svg>
