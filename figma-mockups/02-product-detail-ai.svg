<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="LoopCart advanced product detail mockup">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".48" stop-color="#eef6f7"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <linearGradient id="inkGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101522"/><stop offset="1" stop-color="#263654"/></linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0fa6a6"/><stop offset="1" stop-color="#436fe8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#101522" flood-opacity=".16"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#101522" flood-opacity=".08"/></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#101522" stroke-opacity=".035" stroke-width="1"/></pattern>
    <style>.surface{fill:#fff;stroke:#e4e9f2;stroke-width:2}.glass{fill:#fff;fill-opacity:.86;stroke:#e4e9f2;stroke-width:2}.dark{fill:url(#inkGrad)}.ink{fill:#101522}.slate{fill:#4a5568}.muted{fill:#7a8495}.teal{fill:#0fa6a6}.coral{fill:#ff6b5f}.amber{fill:#f4b83f}.blue{fill:#436fe8}.mint{fill:#dff8ee}.rose{fill:#fff0ee}.title{font:900 44px Inter,Arial,sans-serif}.h2{font:900 25px Inter,Arial,sans-serif}.h3{font:850 18px Inter,Arial,sans-serif}.body{font:500 15px Inter,Arial,sans-serif}.small{font:800 12px Inter,Arial,sans-serif}.micro{font:900 10px Inter,Arial,sans-serif;text-transform:uppercase}.btn{fill:#fff;font:850 13px Inter,Arial,sans-serif}.chipText{font:850 12px Inter,Arial,sans-serif}</style>
  </defs>
  <rect width="1440" height="1080" fill="url(#page)"/>
  <rect width="1440" height="1080" fill="url(#grid)"/>
  <text x="72" y="52" class="micro teal">Advanced Figma screen 02</text>
  <text x="72" y="88" class="title ink">Product Detail + AI Concierge</text>
  <text x="72" y="118" class="body slate">A product page variation using the same premium cards, trust signals, AI plan, and checkout rail style.</text>

  <rect x="72" y="150" width="1296" height="72" rx="14" class="glass" filter="url(#soft)"/>
  <rect x="100" y="166" width="42" height="42" rx="8" fill="url(#inkGrad)"/>
  <text x="111" y="193" fill="#fff" class="small">LC</text>
  <text x="154" y="193" class="h3 ink">LoopCart</text>
  <rect x="430" y="164" width="472" height="44" rx="8" fill="#f5f7fb" stroke="#e4e9f2" stroke-width="2"/>
  <text x="454" y="191" class="small teal">Search</text>
  <text x="522" y="191" class="body muted">Verified workspace products</text>
  <rect x="1204" y="164" width="118" height="44" rx="8" fill="url(#inkGrad)"/>
  <text x="1230" y="191" class="btn">Cart 2</text>

  <g filter="url(#shadow)">
    <rect x="72" y="256" width="520" height="540" rx="8" class="glass"/>
  </g>
  <rect x="108" y="292" width="448" height="320" rx="8" fill="#e9f6f6"/>
  <rect x="184" y="524" width="296" height="24" rx="7" fill="#101522"/>
  <rect x="240" y="402" width="184" height="102" rx="16" fill="#fff" stroke="#0fa6a6" stroke-width="10"/>
  <rect x="288" y="344" width="88" height="42" rx="10" fill="#101522"/>
  <circle cx="480" cy="358" r="40" fill="#ff6b5f"/>
  <path d="M462 358l14 14 28-38" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="108" y="638" width="100" height="82" rx="8" fill="#e9f6f6" stroke="#0fa6a6" stroke-width="3"/>
  <rect x="228" y="638" width="100" height="82" rx="8" fill="#eef3ff" stroke="#e4e9f2" stroke-width="2"/>
  <rect x="348" y="638" width="100" height="82" rx="8" fill="#fff7ed" stroke="#e4e9f2" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="620" y="256" width="426" height="540" rx="8" class="glass"/>
  </g>
  <text x="656" y="312" class="micro teal">Verified product</text>
  <text x="656" y="354" class="title ink">FlexLift Desk Riser</text>
  <text x="656" y="398" class="body slate">Height-adjustable desk riser with product passport, verified repair parts, and resale eligibility.</text>
  <text x="656" y="464" class="title ink">$129</text>
  <text x="770" y="462" class="body slate">4.8 rating - 1,284 reviews</text>
  <rect x="656" y="496" width="140" height="48" rx="8" fill="url(#inkGrad)"/>
  <text x="696" y="526" class="btn">Add cart</text>
  <rect x="812" y="496" width="140" height="48" rx="8" fill="url(#cta)"/>
  <text x="856" y="526" class="btn">Buy now</text>
  <text x="656" y="598" class="h2 ink">Product Passport</text>
  <g transform="translate(656 626)">
    <rect width="180" height="78" rx="8" fill="#f5f7fb" stroke="#e4e9f2" stroke-width="2"/><text x="18" y="30" class="small muted">Trust</text><text x="18" y="60" class="h3 ink">94</text>
    <rect x="198" width="180" height="78" rx="8" fill="#f5f7fb" stroke="#e4e9f2" stroke-width="2"/><text x="216" y="30" class="small muted">Warranty</text><text x="216" y="60" class="h3 ink">24 mo</text>
    <rect y="94" width="180" height="78" rx="8" fill="#f5f7fb" stroke="#e4e9f2" stroke-width="2"/><text x="18" y="124" class="small muted">Resale</text><text x="18" y="154" class="h3 ink">52%</text>
    <rect x="198" y="94" width="180" height="78" rx="8" fill="#f5f7fb" stroke="#e4e9f2" stroke-width="2"/><text x="216" y="124" class="small muted">Carbon</text><text x="216" y="154" class="h3 ink">81</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1074" y="256" width="294" height="540" rx="8" fill="#172033"/>
  </g>
  <path d="M1074 256h294v540h-294z" fill="url(#grid)" opacity=".24"/>
  <text x="1104" y="316" class="micro teal">AI explanation</text>
  <text x="1104" y="356" class="h2" fill="#fff">Why this fits</text>
  <g fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".20" stroke-width="2">
    <rect x="1104" y="390" width="234" height="62" rx="8"/>
    <rect x="1104" y="468" width="234" height="62" rx="8"/>
    <rect x="1104" y="546" width="234" height="62" rx="8"/>
  </g>
  <text x="1126" y="424" class="small" fill="#fff">Compact workspace goal</text>
  <text x="1126" y="502" class="small" fill="#fff">Seller trust above 90</text>
  <text x="1126" y="580" class="small" fill="#fff">Strong resale value</text>
  <rect x="1104" y="650" width="234" height="48" rx="8" fill="url(#cta)"/>
  <text x="1160" y="680" class="btn">Compare items</text>
  <rect x="1104" y="716" width="234" height="48" rx="8" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".24" stroke-width="2"/>
  <text x="1160" y="746" class="btn">Ask a question</text>

  <g transform="translate(72 836)">
    <rect width="1296" height="164" rx="8" class="glass" filter="url(#soft)"/>
    <text x="32" y="48" class="micro teal">Related smart picks</text>
    <text x="32" y="86" class="h2 ink">Bundle-ready alternatives</text>
    <rect x="350" y="36" width="240" height="92" rx="8" class="surface"/>
    <text x="374" y="72" class="h3 ink">LoopSound ANC Pods</text>
    <text x="374" y="104" class="small muted">Trust 91 - resale 46%</text>
    <rect x="618" y="36" width="240" height="92" rx="8" class="surface"/>
    <text x="642" y="72" class="h3 ink">ReLeaf Coffee Kit</text>
    <text x="642" y="104" class="small muted">Trust 96 - gift ready</text>
    <rect x="886" y="36" width="240" height="92" rx="8" class="surface"/>
    <text x="910" y="72" class="h3 ink">TerraPack Day Bag</text>
    <text x="910" y="104" class="small muted">Carbon score 92</text>
  </g>
</svg>
