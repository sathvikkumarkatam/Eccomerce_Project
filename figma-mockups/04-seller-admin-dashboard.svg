<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="LoopCart advanced seller admin dashboard mockup">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".48" stop-color="#eef6f7"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <linearGradient id="inkGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101522"/><stop offset="1" stop-color="#263654"/></linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0fa6a6"/><stop offset="1" stop-color="#436fe8"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b5f"/><stop offset="1" stop-color="#f4b83f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#101522" flood-opacity=".16"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#101522" flood-opacity=".08"/></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#101522" stroke-opacity=".035" stroke-width="1"/></pattern>
    <style>.surface{fill:#fff;stroke:#e4e9f2;stroke-width:2}.glass{fill:#fff;fill-opacity:.86;stroke:#e4e9f2;stroke-width:2}.ink{fill:#101522}.slate{fill:#4a5568}.muted{fill:#7a8495}.teal{fill:#0fa6a6}.coral{fill:#ff6b5f}.amber{fill:#f4b83f}.blue{fill:#436fe8}.mint{fill:#dff8ee}.rose{fill:#fff0ee}.title{font:900 44px Inter,Arial,sans-serif}.h2{font:900 25px Inter,Arial,sans-serif}.h3{font:850 18px Inter,Arial,sans-serif}.body{font:500 15px Inter,Arial,sans-serif}.small{font:800 12px Inter,Arial,sans-serif}.micro{font:900 10px Inter,Arial,sans-serif;text-transform:uppercase}.btn{fill:#fff;font:850 13px Inter,Arial,sans-serif}.chipText{font:850 12px Inter,Arial,sans-serif}</style>
  </defs>
  <rect width="1440" height="1080" fill="url(#page)"/>
  <rect width="1440" height="1080" fill="url(#grid)"/>
  <text x="72" y="52" class="micro teal">Advanced Figma screen 04</text>
  <text x="72" y="88" class="title ink">Seller/Admin Growth Studio</text>
  <text x="72" y="118" class="body slate">Updated dashboard mockup aligned with the frontend metric cards, animated bar chart, and AI insight panels.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="150" width="1296" height="858" rx="8" class="glass"/>
  </g>
  <rect x="72" y="150" width="236" height="858" rx="8" fill="url(#inkGrad)"/>
  <text x="112" y="218" class="h2" fill="#fff">LoopCart</text>
  <rect x="108" y="268" width="164" height="42" rx="8" fill="url(#cta)"/>
  <text x="142" y="295" class="btn">Overview</text>
  <text x="112" y="362" class="body" fill="#c7d0df">Products</text>
  <text x="112" y="414" class="body" fill="#c7d0df">Orders</text>
  <text x="112" y="466" class="body" fill="#c7d0df">Returns</text>
  <text x="112" y="518" class="body" fill="#c7d0df">TrustScore</text>
  <text x="112" y="570" class="body" fill="#c7d0df">Admin alerts</text>
  <rect x="108" y="842" width="164" height="92" rx="8" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
  <text x="128" y="878" class="small" fill="#fff">Trust pulse</text>
  <text x="128" y="914" class="h2" fill="#fff">91</text>

  <text x="352" y="228" class="title ink">Growth Studio</text>
  <text x="352" y="260" class="body slate">Seller performance, platform quality, and AI recommendations in one premium command center.</text>
  <rect x="1188" y="204" width="138" height="48" rx="8" fill="url(#inkGrad)"/>
  <text x="1222" y="234" class="btn">Add product</text>

  <g transform="translate(352 306)">
    <rect width="220" height="128" rx="8" class="surface" filter="url(#soft)"/>
    <text x="22" y="38" class="small muted">Revenue</text>
    <text x="22" y="82" class="title ink">$42.8K</text>
    <text x="22" y="112" class="small teal">+18 percent this month</text>
  </g>
  <g transform="translate(594 306)">
    <rect width="220" height="128" rx="8" class="surface" filter="url(#soft)"/>
    <text x="22" y="38" class="small muted">TrustScore</text>
    <text x="22" y="82" class="title ink">91</text>
    <text x="22" y="112" class="small teal">Return rate improved</text>
  </g>
  <g transform="translate(836 306)">
    <rect width="220" height="128" rx="8" class="surface" filter="url(#soft)"/>
    <text x="22" y="38" class="small muted">Pending orders</text>
    <text x="22" y="82" class="title ink">128</text>
    <text x="22" y="112" class="small slate">24 need packing</text>
  </g>
  <g transform="translate(1078 306)">
    <rect width="220" height="128" rx="8" class="surface" filter="url(#soft)"/>
    <text x="22" y="38" class="small muted">Admin alerts</text>
    <text x="22" y="82" class="title ink">7</text>
    <text x="22" y="112" class="small coral">Approvals and disputes</text>
  </g>

  <g transform="translate(352 478)">
    <rect width="488" height="312" rx="8" class="surface" filter="url(#soft)"/>
    <text x="28" y="52" class="h2 ink">Category momentum</text>
    <rect x="28" y="82" width="72" height="26" rx="13" class="mint"/>
    <text x="48" y="100" class="chipText teal">Live</text>
    <rect x="44" y="142" width="64" height="118" rx="8" fill="url(#cta)"/>
    <rect x="132" y="174" width="64" height="86" rx="8" fill="#436fe8"/>
    <rect x="220" y="112" width="64" height="148" rx="8" fill="url(#warm)"/>
    <rect x="308" y="158" width="64" height="102" rx="8" fill="#0fa6a6"/>
    <rect x="396" y="190" width="64" height="70" rx="8" fill="#95a3b8"/>
    <text x="48" y="286" class="small muted">Work</text>
    <text x="136" y="286" class="small muted">Tech</text>
    <text x="226" y="286" class="small muted">Life</text>
    <text x="312" y="286" class="small muted">Well</text>
    <text x="398" y="286" class="small muted">Home</text>
  </g>

  <g transform="translate(872 478)">
    <rect width="426" height="148" rx="8" fill="#eefafa" stroke="#cfeeed" stroke-width="2" filter="url(#soft)"/>
    <text x="26" y="46" class="h3 ink">AI growth recommendation</text>
    <text x="26" y="80" class="body slate">Bundle FlexLift Desk Riser with LoopSound Pods to lift average order value by 12 percent.</text>
    <rect x="26" y="112" width="340" height="10" rx="5" fill="#e8edf4"/>
    <rect x="26" y="112" width="252" height="10" rx="5" fill="url(#cta)"/>
  </g>

  <g transform="translate(872 650)">
    <rect width="426" height="140" rx="8" fill="#fff7ed" stroke="#f1dda9" stroke-width="2" filter="url(#soft)"/>
    <text x="26" y="46" class="h3 ink">Risk monitor</text>
    <text x="26" y="80" class="body slate">GlowMist Humidifier needs clearer size images and warranty copy before campaign launch.</text>
    <rect x="26" y="108" width="340" height="10" rx="5" fill="#e8edf4"/>
    <rect x="26" y="108" width="198" height="10" rx="5" fill="url(#warm)"/>
  </g>

  <g transform="translate(352 832)">
    <rect width="946" height="110" rx="8" fill="#172033" filter="url(#soft)"/>
    <path d="M0 0h946v110H0z" fill="url(#grid)" opacity=".20"/>
    <text x="28" y="42" class="h3" fill="#fff">Admin moderation queue</text>
    <text x="28" y="74" class="body" fill="#d7deea">2 seller approvals, 3 refund disputes, and 2 suspicious review clusters need review.</text>
    <rect x="764" y="30" width="146" height="48" rx="8" fill="url(#cta)"/>
    <text x="800" y="60" class="btn">Open queue</text>
  </g>
</svg>
