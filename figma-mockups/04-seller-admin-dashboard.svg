<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="LoopCart seller and admin dashboard mockup">
  <defs>
    <style>
      .bg{fill:#f6f8fb}.surface{fill:#fff;stroke:#e5e9f0;stroke-width:2}.ink{fill:#121826}.slate{fill:#4b5565}.muted{fill:#6b7280}.teal{fill:#10a7a7}.coral{fill:#ff6b5f}.amber{fill:#f6b84b}.blue{fill:#4b7bec}.mint{fill:#dff7ef}.title{font:800 34px Inter,Arial,sans-serif}.h2{font:800 24px Inter,Arial,sans-serif}.h3{font:800 18px Inter,Arial,sans-serif}.body{font:500 15px Inter,Arial,sans-serif}.small{font:700 12px Inter,Arial,sans-serif}.micro{font:800 10px Inter,Arial,sans-serif}.buttonText{fill:#fff;font:800 13px Inter,Arial,sans-serif}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#121826" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect class="bg" width="1440" height="1040"/>
  <text x="64" y="54" class="micro teal">Figma screen 04</text>
  <text x="64" y="90" class="title ink">Seller And Admin Dashboard</text>
  <text x="64" y="118" class="body slate">Seller Growth Studio, platform metrics, alerts, and admin moderation controls.</text>

  <rect x="64" y="154" width="1312" height="806" rx="18" class="surface shadow"/>
  <rect x="64" y="154" width="228" height="806" rx="18" fill="#121826"/>
  <text x="104" y="214" fill="#fff" class="h2">LoopCart</text>
  <rect x="96" y="260" width="164" height="40" rx="8" fill="#10a7a7"/>
  <text x="126" y="286" class="buttonText">Overview</text>
  <text x="104" y="344" fill="#b7c1d1" class="body">Products</text>
  <text x="104" y="392" fill="#b7c1d1" class="body">Orders</text>
  <text x="104" y="440" fill="#b7c1d1" class="body">Returns</text>
  <text x="104" y="488" fill="#b7c1d1" class="body">TrustScore</text>
  <text x="104" y="536" fill="#b7c1d1" class="body">Admin alerts</text>

  <text x="332" y="222" class="title ink">Growth Studio</text>
  <text x="332" y="254" class="body slate">AI recommendations for sellers with admin controls for marketplace quality.</text>
  <rect x="1164" y="196" width="146" height="44" rx="8" fill="#121826"/>
  <text x="1198" y="224" class="buttonText">Add product</text>

  <g transform="translate(332 300)">
    <rect width="226" height="138" rx="12" class="surface"/>
    <text x="22" y="38" class="small muted">Revenue</text>
    <text x="22" y="82" class="title ink">$42.8K</text>
    <text x="22" y="112" class="small teal">+18 percent this month</text>
  </g>
  <g transform="translate(582 300)">
    <rect width="226" height="138" rx="12" class="surface"/>
    <text x="22" y="38" class="small muted">TrustScore</text>
    <text x="22" y="82" class="title ink">91</text>
    <text x="22" y="112" class="small teal">Return rate improved</text>
  </g>
  <g transform="translate(832 300)">
    <rect width="226" height="138" rx="12" class="surface"/>
    <text x="22" y="38" class="small muted">Pending orders</text>
    <text x="22" y="82" class="title ink">128</text>
    <text x="22" y="112" class="small slate">24 need packing</text>
  </g>
  <g transform="translate(1082 300)">
    <rect width="226" height="138" rx="12" class="surface"/>
    <text x="22" y="38" class="small muted">Admin alerts</text>
    <text x="22" y="82" class="title ink">7</text>
    <text x="22" y="112" class="small coral">Approvals and disputes</text>
  </g>

  <g transform="translate(332 486)">
    <rect width="476" height="314" rx="14" class="surface"/>
    <text x="28" y="52" class="h2 ink">Sales by category</text>
    <rect x="54" y="104" width="58" height="150" rx="8" class="teal"/>
    <rect x="138" y="142" width="58" height="112" rx="8" class="blue"/>
    <rect x="222" y="84" width="58" height="170" rx="8" class="coral"/>
    <rect x="306" y="128" width="58" height="126" rx="8" class="amber"/>
    <rect x="390" y="164" width="58" height="90" rx="8" fill="#9aa4b2"/>
    <text x="54" y="284" class="small muted">Work</text>
    <text x="138" y="284" class="small muted">Tech</text>
    <text x="222" y="284" class="small muted">Life</text>
    <text x="306" y="284" class="small muted">Well</text>
    <text x="390" y="284" class="small muted">Home</text>
  </g>

  <g transform="translate(832 486)">
    <rect width="476" height="314" rx="14" fill="#eefafa" stroke="#ccefed" stroke-width="2"/>
    <text x="28" y="52" class="h2 ink">AI recommendations</text>
    <rect x="28" y="82" width="420" height="62" rx="10" fill="#fff"/>
    <circle cx="58" cy="113" r="12" class="teal"/>
    <text x="84" y="108" class="h3 ink">Bundle opportunity</text>
    <text x="84" y="132" class="small slate">Desk Riser + ANC Pods may raise AOV by 12 percent.</text>
    <rect x="28" y="166" width="420" height="62" rx="10" fill="#fff"/>
    <circle cx="58" cy="197" r="12" class="coral"/>
    <text x="84" y="192" class="h3 ink">Return risk</text>
    <text x="84" y="216" class="small slate">Add lifestyle photo for GlowMist size clarity.</text>
    <rect x="28" y="250" width="420" height="42" rx="8" fill="#121826"/>
    <text x="160" y="277" class="buttonText">Apply suggestions</text>
  </g>

  <g transform="translate(332 824)">
    <rect width="976" height="84" rx="14" fill="#fff7e7" stroke="#f1dda9" stroke-width="2"/>
    <text x="28" y="36" class="h3 ink">Admin moderation queue</text>
    <text x="28" y="62" class="body slate">2 seller approvals, 3 refund disputes, and 2 suspicious review clusters need review.</text>
    <rect x="788" y="22" width="154" height="40" rx="8" fill="#121826"/>
    <text x="822" y="48" class="buttonText">Open queue</text>
  </g>
</svg>
