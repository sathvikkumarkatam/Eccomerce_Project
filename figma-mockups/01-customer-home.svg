<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="LoopCart advanced customer home mockup">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".48" stop-color="#eef6f7"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="inkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101522"/>
      <stop offset="1" stop-color="#263654"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0fa6a6"/>
      <stop offset="1" stop-color="#436fe8"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b5f"/>
      <stop offset="1" stop-color="#f4b83f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#101522" flood-opacity=".16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#101522" flood-opacity=".08"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#101522" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <style>
      .surface{fill:#fff;stroke:#e4e9f2;stroke-width:2}.glass{fill:#fff;fill-opacity:.84;stroke:#e4e9f2;stroke-width:2}.dark{fill:url(#inkGrad)}.ink{fill:#101522}.slate{fill:#4a5568}.muted{fill:#7a8495}.teal{fill:#0fa6a6}.coral{fill:#ff6b5f}.amber{fill:#f4b83f}.blue{fill:#436fe8}.mint{fill:#dff8ee}.rose{fill:#fff0ee}.title{font:900 44px Inter,Arial,sans-serif}.h2{font:900 25px Inter,Arial,sans-serif}.h3{font:850 18px Inter,Arial,sans-serif}.body{font:500 15px Inter,Arial,sans-serif}.small{font:800 12px Inter,Arial,sans-serif}.micro{font:900 10px Inter,Arial,sans-serif;text-transform:uppercase}.btn{fill:#fff;font:850 13px Inter,Arial,sans-serif}.chipText{font:850 12px Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1440" height="1080" fill="url(#page)"/>
  <rect width="1440" height="1080" fill="url(#grid)"/>
  <text x="72" y="52" class="micro teal">Advanced Figma screen 01</text>
  <text x="72" y="88" class="title ink">LoopCart Customer Home</text>
  <text x="72" y="118" class="body slate">Matches the upgraded frontend: glass header, hero command stage, smart picks, and sticky commerce rail.</text>

  <rect x="72" y="150" width="1296" height="72" rx="14" class="glass" filter="url(#soft)"/>
  <rect x="100" y="166" width="42" height="42" rx="8" fill="url(#inkGrad)"/>
  <text x="111" y="193" fill="#fff" class="small">LC</text>
  <text x="154" y="193" class="h3 ink">LoopCart</text>
  <rect x="430" y="164" width="472" height="44" rx="8" fill="#f5f7fb" stroke="#e4e9f2" stroke-width="2"/>
  <text x="454" y="191" class="small teal">Search</text>
  <text x="522" y="191" class="body muted">Desk setup, earbuds, coffee kit</text>
  <text x="1070" y="191" class="small ink">Shop</text>
  <text x="1130" y="191" class="small ink">Studio</text>
  <rect x="1204" y="164" width="118" height="44" rx="8" fill="url(#inkGrad)"/>
  <text x="1230" y="191" class="btn">Cart 2</text>

  <g filter="url(#shadow)">
    <rect x="72" y="256" width="740" height="470" rx="8" class="glass"/>
  </g>
  <text x="112" y="324" class="micro teal">AI commerce dashboard</text>
  <text x="112" y="382" class="title ink">Shop products with proof, savings, and resale value built in.</text>
  <text x="112" y="426" class="body slate">LoopCart turns ecommerce into a live buying workspace with AI bundles, group discounts, passports, and trade-in credit.</text>
  <rect x="112" y="470" width="178" height="48" rx="8" fill="url(#cta)"/>
  <text x="146" y="499" class="btn">Explore marketplace</text>
  <rect x="306" y="470" width="166" height="48" rx="8" fill="#fff" stroke="#101522" stroke-opacity=".16" stroke-width="2"/>
  <text x="338" y="499" class="small ink">Build AI bundle</text>
  <g>
    <rect x="112" y="570" width="188" height="98" rx="8" class="surface"/>
    <text x="136" y="608" class="small muted">Avg savings</text>
    <text x="136" y="646" class="h2 ink">18%</text>
    <rect x="316" y="570" width="188" height="98" rx="8" class="surface"/>
    <text x="340" y="608" class="small muted">Seller trust</text>
    <text x="340" y="646" class="h2 ink">91</text>
    <rect x="520" y="570" width="188" height="98" rx="8" class="surface"/>
    <text x="544" y="608" class="small muted">Wallet reuse</text>
    <text x="544" y="646" class="h2 ink">$82</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="842" y="256" width="526" height="470" rx="8" fill="#172033"/>
  </g>
  <path d="M842 256h526v470H842z" fill="url(#grid)" opacity=".26"/>
  <g filter="url(#shadow)">
    <rect x="902" y="304" width="406" height="338" rx="8" fill="#fff"/>
  </g>
  <circle cx="930" cy="330" r="5" class="teal"/>
  <text x="944" y="334" class="small muted">Live smart cart</text>
  <rect x="926" y="354" width="358" height="176" rx="8" fill="#e9f6f6"/>
  <rect x="992" y="476" width="226" height="20" rx="6" fill="#101522"/>
  <rect x="1038" y="404" width="136" height="74" rx="14" fill="#fff" stroke="#0fa6a6" stroke-width="8"/>
  <rect x="1075" y="362" width="70" height="34" rx="10" fill="#101522"/>
  <text x="926" y="568" class="h2 ink">FlexLift Desk Riser</text>
  <text x="926" y="596" class="body slate">Verified seller, 24 month warranty, resale eligible.</text>
  <text x="926" y="628" class="h2 ink">$129</text>
  <rect x="1206" y="602" width="78" height="28" rx="14" class="mint"/>
  <text x="1220" y="621" class="chipText teal">Trust 94</text>

  <rect x="866" y="590" width="214" height="92" rx="8" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".24" stroke-width="2"/>
  <rect x="886" y="610" width="54" height="24" rx="12" fill="#0fa6a6" fill-opacity=".75"/>
  <text x="898" y="627" class="micro" fill="#fff">AI pick</text>
  <text x="886" y="654" class="small" fill="#fff">Desk + Pods + Coffee</text>
  <text x="886" y="674" class="small" fill="#d8dee9">Bundle total: $266</text>

  <rect x="1162" y="548" width="178" height="92" rx="8" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".24" stroke-width="2"/>
  <rect x="1182" y="568" width="74" height="24" rx="12" fill="#0fa6a6" fill-opacity=".75"/>
  <text x="1194" y="585" class="micro" fill="#fff">Passport</text>
  <text x="1182" y="612" class="small" fill="#fff">Resale 52%</text>
  <text x="1182" y="632" class="small" fill="#d8dee9">Carbon score 81</text>
  <rect x="890" y="684" width="430" height="4" rx="2" fill="#fff" fill-opacity=".15"/>
  <rect x="890" y="684" width="160" height="4" rx="2" fill="url(#warm)"/>

  <g transform="translate(72 760)">
    <rect width="820" height="230" rx="8" class="glass" filter="url(#soft)"/>
    <text x="28" y="42" class="micro teal">Marketplace</text>
    <text x="28" y="78" class="h2 ink">Smart picks</text>
    <rect x="532" y="30" width="58" height="34" rx="17" fill="url(#inkGrad)"/>
    <text x="552" y="52" class="small" fill="#fff">All</text>
    <rect x="600" y="30" width="104" height="34" rx="17" fill="#fff" stroke="#e4e9f2" stroke-width="2"/>
    <text x="622" y="52" class="small slate">Workspace</text>
    <rect x="714" y="30" width="76" height="34" rx="17" fill="#fff" stroke="#e4e9f2" stroke-width="2"/>
    <text x="738" y="52" class="small slate">Tech</text>

    <g transform="translate(28 104)">
      <rect width="240" height="96" rx="8" class="surface"/>
      <rect x="14" y="14" width="72" height="68" rx="8" fill="#e9f6f6"/>
      <rect x="102" y="18" width="116" height="14" rx="7" class="ink"/>
      <text x="102" y="56" class="small muted">Trust 94 - resale 52%</text>
      <text x="102" y="80" class="small teal">$129</text>
    </g>
    <g transform="translate(292 104)">
      <rect width="240" height="96" rx="8" class="surface"/>
      <rect x="14" y="14" width="72" height="68" rx="8" fill="#eef3ff"/>
      <rect x="102" y="18" width="126" height="14" rx="7" class="ink"/>
      <text x="102" y="56" class="small muted">Trust 91 - bundle pick</text>
      <text x="102" y="80" class="small teal">$89</text>
    </g>
    <g transform="translate(556 104)">
      <rect width="236" height="96" rx="8" class="surface"/>
      <rect x="14" y="14" width="72" height="68" rx="8" fill="#fff7e7"/>
      <rect x="102" y="18" width="112" height="14" rx="7" class="ink"/>
      <text x="102" y="56" class="small muted">Trust 96 - gift ready</text>
      <text x="102" y="80" class="small teal">$48</text>
    </g>
  </g>

  <g transform="translate(920 760)">
    <rect width="448" height="230" rx="8" class="glass" filter="url(#soft)"/>
    <text x="26" y="42" class="micro teal">Command rail</text>
    <text x="26" y="78" class="h2 ink">Checkout + Passport</text>
    <rect x="26" y="104" width="184" height="92" rx="8" fill="#f5f7fb" stroke="#e4e9f2" stroke-width="2"/>
    <text x="46" y="136" class="small muted">Cart total</text>
    <text x="46" y="174" class="h2 ink">$246.59</text>
    <rect x="232" y="104" width="184" height="92" rx="8" fill="#eefafa" stroke="#cfeeed" stroke-width="2"/>
    <text x="252" y="136" class="small muted">Group discount</text>
    <text x="252" y="174" class="h2 teal">10%</text>
  </g>
</svg>
